version: 2

sources:
  - name: raw
    database: TAXIOPS_DB
    schema: RAW
    tables:
      - name: taxi_trips_silver
        description: "Cleaned Silver taxi trips loaded from PySpark into Snowflake."
        columns:
          - name: pickup_ts
            tests:
              - not_null
          - name: dropoff_ts
            tests:
              - not_null
          - name: fare_amount
            tests:
              - not_null
          - name: trip_distance
            tests:
              - not_null

models:
  - name: stg_taxi_trips_silver
    description: "Staging model that derives reusable Gold metrics from the Silver trips table."
    columns:
      - name: pickup_date
        tests:
          - not_null
      - name: pickup_hour
        tests:
          - not_null