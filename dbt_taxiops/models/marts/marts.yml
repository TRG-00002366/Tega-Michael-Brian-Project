version: 2

models:
  - name: hourly_kpis
    description: Hourly taxi trip KPIs aggregated by pickup date and hour.
    columns:
      - name: pickup_date
        tests: [not_null]
      - name: pickup_hour
        tests: [not_null]
      - name: total_trips
        tests: [not_null]

  - name: payment_kpis
    description: Daily taxi trip KPIs aggregated by payment type.
    columns:
      - name: pickup_date
        tests: [not_null]
      - name: payment_type
        tests: [not_null]
      - name: total_trips
        tests: [not_null]

  - name: vendor_kpis
    description: Daily taxi trip KPIs aggregated by vendor.
    columns:
      - name: pickup_date
        tests: [not_null]
      - name: vendor_id
        tests: [not_null]
      - name: total_trips
        tests: [not_null]